services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-hms}
      POSTGRES_USER: ${DB_USER:-hms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hms_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hms} -d ${DB_NAME:-hms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3200}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hms}
      DB_USER: ${DB_USER:-hms}
      DB_PASSWORD: ${DB_PASSWORD:-hms_secret}
      AUTO_MIGRATE: "true"
    volumes:
      - uploads:/app/uploads
    ports:
      - "5000:5000"

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - server
    environment:
      NODE_ENV: production
      PORT: 3200
      API_PROXY_TARGET: http://server:5000
    ports:
      - "3200:3200"

volumes:
  pgdata:
  uploads:
